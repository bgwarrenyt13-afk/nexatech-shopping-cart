<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXATECH | Shopping Cart</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #071426;
  color: white;
}

header {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

h1 { color: #42c8f5; }

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: bold;
  margin: 4px;
}

.add {
  background: #36c5d9;
  color: #061421;
}

.cart-button {
  background: #2464a8;
  color: white;
}

.secondary {
  background: #263c56;
  color: white;
}

.remove {
  background: #a83245;
  color: white;
}

main {
  max-width: 1000px;
  margin: 25px auto;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 18px;
}

.card, .cart-box {
  background: #142c49;
  border: 1px solid #315477;
  border-radius: 16px;
  padding: 20px;
}

.product-icon {
  font-size: 55px;
  text-align: center;
  padding: 20px;
}

.code {
  color: #5bd4ed;
  font-size: 13px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  color: #ffe18a;
}

.cart-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 15px 0;
  border-bottom: 1px solid #38506b;
}

.total {
  font-size: 25px;
  color: #ffe18a;
  font-weight: bold;
}

.hidden { display: none; }

a { color: #65d8fa; }

footer {
  text-align: center;
  color: #9bb1c8;
  margin: 35px 0;
}
</style>
</head>

<body>

<header>
  <h1>NEXATECH</h1>
  <button class="cart-button" onclick="openCart()">
    🛒 SHOPPING CART (<span id="cartCount">0</span>)
  </button>
</header>

<main>

  <section id="catalog">
    <h2>Our Technology Products</h2>
    <div class="products" id="productList"></div>
  </section>

  <section id="singleProduct" class="hidden">
    <div id="singleProductContent"></div>
    <button class="secondary" onclick="showCatalog()">
      BACK TO PRODUCTS
    </button>
  </section>

  <section id="shoppingCart" class="hidden">
    <div class="cart-box">
      <h2>🛒 YOUR SHOPPING CART</h2>
      <div id="cartItems"></div>
      <hr>
      <p id="subtotal"></p>
      <p id="total" class="total"></p>

      <button class="secondary" onclick="showCatalog()">
        CONTINUE SHOPPING
      </button>

      <button class="add" onclick="checkout()">
        PROCEED TO CHECKOUT
      </button>
    </div>
  </section>

</main>

<footer>
  NEXATECH © 2026 | Online Technology Store
</footer>

<script>

// =================================
// 1. PRODUCT DATABASE
// =================================

const products = [
  {
    id: "PRODUCT-001",
    name: "Gaming Laptop MSI Cyborg 15",
    price: 800,
    icon: "💻"
  },
  {
    id: "PRODUCT-002",
    name: "iPhone 18 Pro Max",
    price: null,
    icon: "📱"
  },
  {
    id: "PRODUCT-003",
    name: "AirPods Max 2",
    price: null,
    icon: "🎧"
  },
  {
    id: "PRODUCT-004",
    name: "Samsung 75-inch Mini LED UHD 4K",
    price: null,
    icon: "📺"
  },
  {
    id: "PRODUCT-005",
    name: "PlayStation 5 Pro 2TB",
    price: null,
    icon: "🎮"
  },
  {
    id: "PRODUCT-006",
    name: "Staren 3MP WiFi Security Camera",
    price: null,
    icon: "📷"
  }
];

// =================================
// 2. SHARED SHOPPING CART
// =================================

const STORAGE_KEY = "NEXATECH_SHARED_CART_V1";

function getCart() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (error) {
    return {};
  }
}

function saveCart(cart) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
  updateCartCount();
}

// =================================
// 3. ADD PRODUCT TO CART
// =================================

function addToCart(productId) {
  const product = products.find(p => p.id === productId);

  if (!product) return;

  if (product.price === null) {
    alert("El precio de este producto todavía está pendiente de confirmar.");
    return;
  }

  const cart = getCart();

  if (cart[productId]) {
    cart[productId].quantity += 1;
  } else {
    cart[productId] = {
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    };
  }

  saveCart(cart);
  alert(product.name + " agregado al carrito.");
}

// =================================
// 4. CART COUNTER
// =================================

function updateCartCount() {
  const cart = getCart();

  const count = Object.values(cart).reduce(
    (sum, item) => sum + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;
}

// =================================
// 5. SHOW ALL PRODUCTS
// =================================

function renderCatalog() {
  const container = document.getElementById("productList");

  container.innerHTML = products.map(product => `
    <article class="card">
      <div class="product-icon">${product.icon}</div>

      <p class="code">${product.id}</p>

      <h3>${product.name}</h3>

      <p class="price">
        ${product.price === null
          ? "Price pending confirmation"
          : "$" + product.price.toFixed(2) + " USD"}
      </p>

      <button class="add"
        onclick="addToCart('${product.id}')">
        ADD TO CART
      </button>

      <button class="secondary"
        onclick="openProduct('${product.id}')">
        VIEW PRODUCT
      </button>
    </article>
  `).join("");
}

// =================================
// 6. SHOW INDIVIDUAL PRODUCT
// =================================

function openProduct(productId) {
  const product = products.find(p => p.id === productId);

  if (!product) {
    showCatalog();
    return;
  }

  document.getElementById("catalog").classList.add("hidden");
  document.getElementById("shoppingCart").classList.add("hidden");
  document.getElementById("singleProduct").classList.remove("hidden");

  document.getElementById("singleProductContent").innerHTML = `
    <div class="card">
      <div class="product-icon">${product.icon}</div>

      <p class="code">${product.id}</p>

      <h2>${product.name}</h2>

      <p class="price">
        ${product.price === null
          ? "Price pending confirmation"
          : "$" + product.price.toFixed(2) + " USD"}
      </p>

      <button class="add"
        onclick="addToCart('${product.id}')">
        ADD TO CART
      </button>

      <button class="cart-button" onclick="openCart()">
        VIEW CART
      </button>
    </div>
  `;
}

// =================================
// 7. SHOW SHOPPING CART
// =================================

function openCart() {
  document.getElementById("catalog").classList.add("hidden");
  document.getElementById("singleProduct").classList.add("hidden");
  document.getElementById("shoppingCart").classList.remove("hidden");

  renderCart();
}

function renderCart() {
  const cart = getCart();
  const container = document.getElementById("cartItems");

  const items = Object.values(cart);

  if (items.length === 0) {
    container.innerHTML = "<p>Your cart is empty.</p>";
  } else {
    container.innerHTML = items.map(item => `
      <div class="cart-line">
        <div>
          <strong>${item.name}</strong>
          <p>${item.id}</p>
          <p>$${item.price.toFixed(2)} USD each</p>
          <p>Subtotal: $${(item.price * item.quantity).toFixed(2)}</p>
        </div>

        <div>
          <button class="secondary"
            onclick="changeQuantity('${item.id}', -1)">−</button>

          <strong>${item.quantity}</strong>

          <button class="secondary"
            onclick="changeQuantity('${item.id}', 1)">+</button>

          <button class="remove"
            onclick="removeItem('${item.id}')">REMOVE</button>
        </div>
      </div>
    `).join("");
  }

  const total = items.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  document.getElementById("subtotal").textContent =
    "Subtotal: $" + total.toFixed(2) + " USD";

  document.getElementById("total").textContent =
    "TOTAL: $" + total.toFixed(2) + " USD";
}

// =================================
// 8. CHANGE QUANTITY
// =================================

function changeQuantity(productId, amount) {
  const cart = getCart();

  if (!cart[productId]) return;

  cart[productId].quantity += amount;

  if (cart[productId].quantity <= 0) {
    delete cart[productId];
  }

  saveCart(cart);
  renderCart();
}

// =================================
// 9. REMOVE PRODUCT
// =================================

function removeItem(productId) {
  const cart = getCart();

  delete cart[productId];

  saveCart(cart);
  renderCart();
}

// =================================
// 10. NAVIGATION
// =================================

function showCatalog() {
  document.getElementById("catalog").classList.remove("hidden");
  document.getElementById("singleProduct").classList.add("hidden");
  document.getElementById("shoppingCart").classList.add("hidden");
}

// =================================
// 11. CHECKOUT
// =================================

// Add your real Google Forms URL here.
const GOOGLE_FORM_URL = "";

function checkout() {
  const cart = getCart();

  if (Object.keys(cart).length === 0) {
    alert("Your shopping cart is empty.");
    return;
  }

  if (!GOOGLE_FORM_URL) {
    alert("Your cart is ready. Add your Google Forms URL to the code to activate Checkout.");
    return;
  }

  window.open(GOOGLE_FORM_URL, "_blank");
}

// =================================
// 12. INITIALIZE PAGE
// =================================

function initialize() {
  renderCatalog();
  updateCartCount();

  const params = new URLSearchParams(window.location.search);

  const productId = params.get("product");

  if (params.get("cart") === "1") {
    openCart();
  } else if (productId) {
    openProduct(productId);
  } else {
    showCatalog();
  }
}

initialize();

</script>
</body>
</html>
